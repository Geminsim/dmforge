<!doctype html><html data-theme="terminal"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"><style>body{margin:0;padding:16px;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-body)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:44px;border:1px solid var(--line-hairline);border-radius:var(--radius-md)}.n{font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}.h{font-size:10px;color:var(--text-faint);font-family:var(--font-mono)}.g{display:grid;gap:10px}.lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)"><div class="sw"><div class="chip" style="background:var(--surface-app)"></div><span class="n">surface-app</span><span class="h">#0a0c0e</span></div><div class="sw"><div class="chip" style="background:var(--surface-panel)"></div><span class="n">surface-panel</span><span class="h">#0f1317</span></div><div class="sw"><div class="chip" style="background:var(--surface-raised)"></div><span class="n">surface-raised</span><span class="h">#161b21</span></div><div class="sw"><div class="chip" style="background:var(--surface-hover)"></div><span class="n">surface-hover</span><span class="h">#1d242c</span></div><div class="sw"><div class="chip" style="background:var(--surface-sunken)"></div><span class="n">surface-sunken</span><span class="h">#06080a</span></div></div></body></html>
