<!-- @dsCard group="Colors" viewport="700x150" name="文字层级" subtitle="body / muted / faint / on-accent —— 三层足够，不要第四层" -->
<!doctype html><html data-theme="slate"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"><style>body{margin:0;padding:16px;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-body)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:44px;border:1px solid var(--line-hairline);border-radius:var(--radius-md)}.n{font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}.h{font-size:10px;color:var(--text-faint);font-family:var(--font-mono)}.g{display:grid;gap:10px}.lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div style="display:flex;gap:14px">
<div style="flex:1;padding:12px;background:var(--surface-panel);border:1px solid var(--line-hairline);border-radius:var(--radius-panel);display:flex;flex-direction:column;gap:8px">
<span style="font-size:14px;color:var(--text-body)">text-body — 角色名、正文、数值</span>
<span style="font-size:13px;color:var(--text-muted)">text-muted — 描述、次级说明、未选中标签</span>
<span style="font-size:12px;color:var(--text-faint)">text-faint — 时间戳、单位、计数、空状态</span>
<span style="align-self:flex-start;font-size:12px;background:var(--accent);color:var(--text-on-accent);padding:3px 8px;border-radius:var(--radius-md)">text-on-accent — 主按钮文字</span></div></div></body></html>
