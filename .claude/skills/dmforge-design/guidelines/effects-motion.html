<!doctype html><html data-theme="slate"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"><style>body{margin:0;padding:16px;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-body)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:44px;border:1px solid var(--line-hairline);border-radius:var(--radius-md)}.n{font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}.h{font-size:10px;color:var(--text-faint);font-family:var(--font-mono)}.g{display:grid;gap:10px}.lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap" class="h">
<span style="padding:6px 10px;border:1px solid var(--line-hairline);border-radius:var(--radius-md)">dur-instant 90ms <span style="color:var(--text-muted)">按压反馈</span></span>
<span style="padding:6px 10px;border:1px solid var(--line-hairline);border-radius:var(--radius-md)">dur-fast 140ms <span style="color:var(--text-muted)">悬停 / 颜色</span></span>
<span style="padding:6px 10px;border:1px solid var(--line-hairline);border-radius:var(--radius-md)">dur-base 200ms <span style="color:var(--text-muted)">面板淡入 / 血条</span></span>
<span style="padding:6px 10px;border:1px solid var(--line-hairline);border-radius:var(--radius-md)">dur-slow 280ms <span style="color:var(--text-muted)">侧栏折叠</span></span>
<span style="padding:6px 10px;border:1px solid var(--accent-line);border-radius:var(--radius-md);color:var(--accent)">ease-standard cubic-bezier(.2,0,.2,1)</span>
<span style="animation:dmf-rise-in 1.4s var(--ease-out) infinite alternate;padding:6px 10px;background:var(--surface-raised);border:1px solid var(--line-hairline);border-radius:var(--radius-md);color:var(--text-muted)">rise-in 示意</span></div></body></html>
