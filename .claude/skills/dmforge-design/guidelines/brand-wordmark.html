<!-- @dsCard group="Brand" viewport="700x210" name="字标（无 logo）" subtitle="源仓库没有品牌标志，字标即品牌：Spectral 700，M 取强调色；三套主题下 M 随主题变色" -->
<!doctype html><html data-theme="grimoire"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-sans)}
.plate{position:relative;background:var(--surface-panel);padding:12px 13px}
.plate i.br{position:absolute;width:10px;height:10px;border:1px solid var(--bracket-line)}
.b1{left:0;top:0;border-right:none;border-bottom:none}.b2{right:0;top:0;border-left:none;border-bottom:none}
.b3{left:0;bottom:0;border-right:none;border-top:none}.b4{right:0;bottom:0;border-left:none;border-top:none}
.k{font-family:var(--font-label);font-size:10px;letter-spacing:.2em;color:var(--accent)}
.nm{font-family:var(--font-display);font-weight:var(--display-weight);letter-spacing:var(--display-tracking);font-size:15px;margin:4px 0 8px}
.row{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--text-muted)}
.row .lead{flex:1;border-top:1px dotted var(--rule-dotted);transform:translateY(-3px)}
.row b{font-family:var(--font-mono);color:var(--text-body)}
.seg{display:flex;gap:2px;margin:7px 0}.seg i{flex:1;height:8px;background:var(--pigment-verdigris)}.seg i.o{background:transparent;box-shadow:inset 0 0 0 1px var(--meter-empty)}
.btn{display:inline-block;padding:5px 11px;background:var(--accent);color:var(--text-on-accent);font-size:12px;letter-spacing:.03em}
.cap{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:9px;line-height:1.6}
.cap b{color:var(--text-muted)}
.wm{font-family:var(--font-display);font-weight:700;letter-spacing:.02em;color:var(--text-body)}
.wm em{font-style:normal;color:var(--accent)}
.tri{display:flex;gap:10px;margin-top:12px}
.tri>div{flex:1;padding:10px 12px;background:var(--surface-panel);box-shadow:inset 0 0 0 1px var(--line-hairline)}
.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body>
<div style="display:flex;align-items:flex-end;gap:34px;flex-wrap:wrap">
<div><div class="wm" style="font-size:36px">D<em>M</em>Forge</div><div class="mono">主字标 · Spectral 700 · M = --accent</div></div>
<div><div class="wm" style="font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted)">DMFORGE</div><div class="mono">页眉 / 小尺寸 · 字距 .2em · 单色</div></div>
<div><span style="display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;background:var(--accent);color:var(--text-on-accent);font-family:var(--font-display);font-weight:700;font-size:21px">D</span><div class="mono">应用图标位（占位，非正式 logo）</div></div>
</div>
<div class="tri">
<div data-theme="grimoire"><div class="wm" style="font-size:22px">D<em>M</em>Forge</div><div class="mono">grimoire</div></div><div data-theme="slate"><div class="wm" style="font-size:22px">D<em>M</em>Forge</div><div class="mono">slate</div></div><div data-theme="terminal"><div class="wm" style="font-size:22px">D<em>M</em>Forge</div><div class="mono">terminal</div></div>
</div>
<div class="cap">禁止：给字标加描边、阴影、渐变或倾斜；禁止把 M 之外的字母着色；禁止在朱批红底上放红色 M（改用 --text-on-accent 单色版）。</div>
</body></html>
